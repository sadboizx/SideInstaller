# .github/workflows/sign.yml
#
# "Sign IPA" — được website gọi mỗi khi user bấm Sign trên một app
# (Worker gọi POST /api/sign → workflow_dispatch với input `cert` + `ipa`).
#
# Vì sao dùng GitHub Actions? zsign là native binary, KHÔNG chạy được trên
# Cloudflare Workers, nên việc sign diễn ra ở đây trên Ubuntu runner:
#   1. Validate certificate (phải có trong public/certificates/index.json)
#   2. Resolve app từ public/ipas.json → IPA trong repo, hoặc download
#      nếu source là URL ngoài (ví dụ YouTube)
#   3. Build zsign từ source (https://github.com/zhlynn/zsign)
#   4. Sign IPA bằng .p12 + .mobileprovision của cert → signed.ipa
#   5. Upload IPA đã sign lên GitHub Release (tag <ipa>-signed-<cert>)
#   6. Sinh public/output/<ipa>-<cert>.plist (OTA manifest), key `url`
#      trỏ vào release asset
#   7. Commit plist → Worker auto-redeploy → manifest lên sóng tại
#      https://<site>/output/<ipa>-<cert>.plist
#
# Repository secrets cần thiết (Settings → Secrets and variables → Actions):
#   P12_PASSWORDS (không bắt buộc) — JSON map tên folder cert → mật khẩu .p12,
#     ví dụ: {"China Telecom Corporation Limited": "mat-khau-p12"}
#     Cert nào p12 không có mật khẩu thì không cần khai báo.

name: Sign IPA

on:
  workflow_dispatch:
    inputs:
      cert:
        description: "Certificate folder name under public/certificates/"
        required: true
        type: string
      ipa:
        description: "App to sign (id from public/ipas.json)"
        required: true
        type: choice
        options: [feather, esign, ksign, youtube]

# Website poll runs API và match tên này với cặp certificate + app.
run-name: "sign :: ${{ inputs.cert }} :: ${{ inputs.ipa }}"

permissions:
  contents: write

concurrency:
  group: sign-${{ inputs.cert }}-${{ inputs.ipa }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate certificate and resolve inputs
        id: prep
        env:
          CERT_INPUT: ${{ inputs.cert }}
          P12_PASSWORDS: ${{ secrets.P12_PASSWORDS }}
        run: |
          python3 - <<'PYEOF'
          import glob, json, os, sys

          cert = os.environ.get("CERT_INPUT", "").strip()
          index = json.load(open("public/certificates/index.json"))
          if cert not in index:
              print(f"::error::Certificate '{cert}' is not listed in public/certificates/index.json")
              sys.exit(1)

          cert_dir = os.path.join("public/certificates", cert)
          p12s = sorted(glob.glob(os.path.join(cert_dir, "*.p12")))
          provs = sorted(glob.glob(os.path.join(cert_dir, "*.mobileprovision")))
          if not p12s:
              print(f"::error::No .p12 file found in {cert_dir}")
              sys.exit(1)
          if not provs:
              print(f"::error::No .mobileprovision file found in {cert_dir}")
              sys.exit(1)

          raw = os.environ.get("P12_PASSWORDS") or "{}"
          try:
              pw_map = json.loads(raw)
          except Exception as exc:
              print(f"::error::P12_PASSWORDS secret is not valid JSON: {exc}")
              sys.exit(1)
          password = pw_map.get(cert, "") or ""
          if password:
              print(f"::add-mask::{password}")  # không để mật khẩu lọt vào log

          safe = "".join(ch if (ch.isalnum() or ch in "._-") else "-" for ch in cert.replace(" ", "-"))
          safe = "-".join(filter(None, safe.split("-"))) or "cert"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"cert={cert}\n")
              f.write(f"safe={safe}\n")
              f.write(f"p12={p12s[0]}\n")
              f.write(f"mobileprovision={provs[0]}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"P12_PASS={password}\n")
          print(f"certificate='{cert}' safe='{safe}' p12='{p12s[0]}'")
          PYEOF

      - name: Resolve IPA source
        id: ipa
        env:
          IPA_INPUT: ${{ inputs.ipa }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request

          ipa_id = os.environ.get("IPA_INPUT", "").strip()
          ipas = json.load(open("public/ipas.json"))
          entry = next((x for x in ipas if x.get("id") == ipa_id), None)
          if not entry:
              print(f"::error::IPA '{ipa_id}' is not listed in public/ipas.json")
              sys.exit(1)

          source = entry["source"]
          if source.startswith("http://") or source.startswith("https://"):
              print(f"downloading {source}")
              urllib.request.urlretrieve(source, "unsigned.ipa")
              ipa_path = "unsigned.ipa"
          else:
              ipa_path = os.path.join("public", source)
              if not os.path.isfile(ipa_path):
                  print(f"::error::IPA file not found in repo: {ipa_path}")
                  sys.exit(1)

          size = os.path.getsize(ipa_path)
          print(f"ipa='{ipa_id}' name='{entry['name']}' path='{ipa_path}' size={size}")

          safe = "${{ steps.prep.outputs.safe }}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ipa_id={ipa_id}\n")
              f.write(f"ipa_name={entry['name']}\n")
              f.write(f"ipa_path={ipa_path}\n")
              f.write(f"tag={ipa_id}-signed-{safe}\n")
              f.write(f"asset={ipa_id}-{safe}.ipa\n")
              f.write(f"plist=public/output/{ipa_id}-{safe}.plist\n")
          PYEOF

      - name: Build zsign from source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git g++ pkg-config libssl-dev
          git clone --depth 1 https://github.com/zhlynn/zsign.git zsign-src
          make -C zsign-src/build/linux clean
          make -C zsign-src/build/linux -j"$(nproc)"
          # NOTE: Makefile của zsign output binary ra zsign-src/bin/zsign,
          # KHÔNG phải zsign-src/build/linux/zsign
          ./zsign-src/bin/zsign -v
          echo "ZSIGN_BIN=$PWD/zsign-src/bin/zsign" >> "$GITHUB_ENV"

      - name: Sign IPA with zsign
        run: |
          set -euo pipefail
          args=(-k "${{ steps.prep.outputs.p12 }}" -m "${{ steps.prep.outputs.mobileprovision }}" -o signed.ipa)
          if [ -n "${P12_PASS:-}" ]; then
            args+=(-p "$P12_PASS")
          fi
          args+=("${{ steps.ipa.outputs.ipa_path }}")
          "$ZSIGN_BIN" "${args[@]}"
          ls -lh signed.ipa

      - name: Read bundle info from signed IPA
        id: bundle
        run: |
          python3 - <<'PYEOF'
          import os, plistlib, zipfile
          with zipfile.ZipFile("signed.ipa") as z:
              info_name = next(
                  n for n in z.namelist()
                  if n.startswith("Payload/") and n.count("/") == 2 and n.endswith(".app/Info.plist")
              )
              info = plistlib.loads(z.read(info_name))
          bid = info["CFBundleIdentifier"]
          ver = str(info.get("CFBundleShortVersionString") or info.get("CFBundleVersion") or "1.0")
          title = str(info.get("CFBundleDisplayName") or info.get("CFBundleName") or "App")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"bundle_id={bid}\n")
              f.write(f"bundle_version={ver}\n")
              f.write(f"title={title}\n")
          print(f"bundle_id={bid} version={ver} title={title}")
          PYEOF

      - name: Publish signed IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ipa.outputs.tag }}"
          ASSET="${{ steps.ipa.outputs.asset }}"
          cp signed.ipa "$ASSET"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "${{ steps.ipa.outputs.ipa_name }} (signed) — ${{ steps.prep.outputs.cert }}" \
              --notes "${{ steps.ipa.outputs.ipa_name }} automatically signed with the **${{ steps.prep.outputs.cert }}** certificate by the \"Sign IPA\" workflow. The website installs it via the matching OTA manifest in public/output/. Do not delete this release while the certificate is in use."
          fi
          # Upload phải idempotent: re-run (hoặc 2 run đua nhau sau double-tap)
          # upload cùng tên asset. Xóa asset cũ theo tên trước — chỉ dùng
          # --clobber có thể 422 "ReleaseAsset.name already exists" khi race.
          gh release delete-asset "$TAG" "$ASSET" -y 2>/dev/null || true
          gh release upload "$TAG" "$ASSET"
          echo "Released: $(gh release view "$TAG" --json url -q .url)"

      - name: Generate OTA install manifest (plist)
        env:
          REPO_FULL: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import os
          repo = os.environ["REPO_FULL"]
          tag = "${{ steps.ipa.outputs.tag }}"
          asset = "${{ steps.ipa.outputs.asset }}"
          plist_path = "${{ steps.ipa.outputs.plist }}"
          bundle_id = "${{ steps.bundle.outputs.bundle_id }}"
          bundle_version = "${{ steps.bundle.outputs.bundle_version }}"
          title = "${{ steps.bundle.outputs.title }}"
          ipa_url = f"https://github.com/{repo}/releases/download/{tag}/{asset}"

          def esc(s):
              return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          lines = [
          '<?xml version="1.0" encoding="UTF-8"?>',
          '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
          '<plist version="1.0">',
          '<dict>',
          '  <key>items</key>',
          '  <array>',
          '    <dict>',
          '      <key>assets</key>',
          '      <array>',
          '        <dict>',
          '          <key>kind</key>',
          '          <string>software-package</string>',
          '          <key>url</key>',
          '          <string>' + esc(ipa_url) + '</string>',
          '        </dict>',
          '      </array>',
          '      <key>metadata</key>',
          '      <dict>',
          '        <key>bundle-identifier</key>',
          '        <string>' + esc(bundle_id) + '</string>',
          '        <key>bundle-version</key>',
          '        <string>' + esc(bundle_version) + '</string>',
          '        <key>kind</key>',
          '        <string>software</string>',
          '        <key>title</key>',
          '        <string>' + esc(title) + '</string>',
          '      </dict>',
          '    </dict>',
          '  </array>',
          '</dict>',
          '</plist>',
          ]
          os.makedirs(os.path.dirname(plist_path), exist_ok=True)
          with open(plist_path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print(f"wrote {plist_path} -> {ipa_url}")
          PYEOF

      - name: Commit OTA manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.ipa.outputs.plist }}"
          if git diff --cached --quiet; then
            echo "manifest unchanged, nothing to commit"
          else
            git commit -m "chore: signed ${{ steps.ipa.outputs.ipa_id }} manifest for ${{ steps.prep.outputs.cert }}"
            git push
          fi

      - name: Summary
        run: |
          {
            echo "### ${{ steps.ipa.outputs.ipa_name }} signed"
            echo ""
            echo "- Certificate: \`${{ steps.prep.outputs.cert }}\`"
            echo "- Release tag: \`${{ steps.ipa.outputs.tag }}\`"
            echo "- Manifest: \`${{ steps.ipa.outputs.plist }}\`"
            echo "- Bundle ID: \`${{ steps.bundle.outputs.bundle_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
