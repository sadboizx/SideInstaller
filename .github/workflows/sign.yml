# .github/workflows/sign.yml
#
# "Sign IPA" — được website gọi mỗi khi user bấm Sign trên một app
# (Worker gọi POST /api/sign → workflow_dispatch với input `cert` + `ipa`).
#
# Vì sao dùng GitHub Actions? zsign là native binary, KHÔNG chạy được trên
# Cloudflare Workers, nên việc sign diễn ra ở đây trên Ubuntu runner:
#   1. Validate certificate (phải có trong public/certificates/index.json)
#   2. Resolve app từ public/ipas.json → IPA trong repo, hoặc download
#      nếu source là URL ngoài (ví dụ YouTube)
#   3. PPQ Protection (port từ Feather): đọc key `PPQCheck` trong provision
#      (giống Feather đọc CertificateModel.PPQCheck) — chỉ bỏ qua khi key
#      này là false. Khi áp dụng: append hậu tố 6 ký tự (ổn định theo từng
#      cặp app + cert, thay vì random như Feather) vào CFBundleIdentifier
#      của app chính; các appex plugin được replace old-id -> new-id trong
#      4 key mà Feather xử lý (CFBundleIdentifier,
#      WKCompanionAppBundleIdentifier,
#      NSExtension.NSExtensionAttributes.WKAppBundleIdentifier,
#      NSExtension.NSExtensionFileProviderDocumentGroup) — rồi mới sign.
#   4. Embed signing-assets: tạo folder `signing-assets/SideInstaller/`
#      bên trong .app (kèm signed.json ghi cert, bundle id cuối, thời gian
#      ký, run id) TRƯỚC khi sign để chữ ký của zsign bao phủ luôn folder.
#   5. Build zsign từ source (https://github.com/zhlynn/zsign)
#   6. Sign IPA bằng .p12 + .mobileprovision của cert → signed.ipa
#   7. Upload IPA đã sign lên GitHub Release (tag <ipa>-signed-<cert>)
#   8. Sinh public/output/<ipa>-<cert>.plist (OTA manifest), key `url`
#      trỏ vào release asset (bundle-identifier trong manifest được đọc từ
#      IPA đã sign nên tự khớp với bundle id đã qua PPQ)
#   9. Commit plist → Pages auto-redeploy → manifest lên sóng tại
#      https://<site>/output/<ipa>-<cert>.plist
#
# Repository secrets cần thiết (Settings → Secrets and variables → Actions):
#   P12_PASSWORDS (không bắt buộc) — JSON map tên folder cert → mật khẩu .p12,
#     ví dụ: {"China Telecom Corporation Limited": "mat-khau-p12"}
#     Cert nào p12 không có mật khẩu thì không cần khai báo.

name: Sign IPA

on:
  workflow_dispatch:
    inputs:
      cert:
        description: "Certificate folder name under public/certificates/"
        required: true
        type: string
      ipa:
        description: "App to sign (id from public/ipas.json)"
        required: true
        type: choice
        options: [feather, esign, ksign, youtube]

# Website poll runs API và match tên này với cặp certificate + app.
run-name: "sign :: ${{ inputs.cert }} :: ${{ inputs.ipa }}"

permissions:
  contents: write

concurrency:
  group: sign-${{ inputs.cert }}-${{ inputs.ipa }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate certificate and resolve inputs
        id: prep
        env:
          CERT_INPUT: ${{ inputs.cert }}
          P12_PASSWORDS: ${{ secrets.P12_PASSWORDS }}
        run: |
          python3 - <<'PYEOF'
          import glob, json, os, sys

          cert = os.environ.get("CERT_INPUT", "").strip()
          index = json.load(open("public/certificates/index.json"))
          if cert not in index:
              print(f"::error::Certificate '{cert}' is not listed in public/certificates/index.json")
              sys.exit(1)

          cert_dir = os.path.join("public/certificates", cert)
          p12s = sorted(glob.glob(os.path.join(cert_dir, "*.p12")))
          provs = sorted(glob.glob(os.path.join(cert_dir, "*.mobileprovision")))
          if not p12s:
              print(f"::error::No .p12 file found in {cert_dir}")
              sys.exit(1)
          if not provs:
              print(f"::error::No .mobileprovision file found in {cert_dir}")
              sys.exit(1)

          raw = os.environ.get("P12_PASSWORDS") or "{}"
          try:
              pw_map = json.loads(raw)
          except Exception as exc:
              print(f"::error::P12_PASSWORDS secret is not valid JSON: {exc}")
              sys.exit(1)
          password = pw_map.get(cert, "") or ""
          if password:
              print(f"::add-mask::{password}")  # không để mật khẩu lọt vào log

          safe = "".join(ch if (ch.isalnum() or ch in "._-") else "-" for ch in cert.replace(" ", "-"))
          safe = "-".join(filter(None, safe.split("-"))) or "cert"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"cert={cert}\n")
              f.write(f"safe={safe}\n")
              f.write(f"p12={p12s[0]}\n")
              f.write(f"mobileprovision={provs[0]}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"P12_PASS={password}\n")
          print(f"certificate='{cert}' safe='{safe}' p12='{p12s[0]}'")
          PYEOF

      - name: Resolve IPA source
        id: ipa
        env:
          IPA_INPUT: ${{ inputs.ipa }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request

          ipa_id = os.environ.get("IPA_INPUT", "").strip()
          ipas = json.load(open("public/ipas.json"))
          entry = next((x for x in ipas if x.get("id") == ipa_id), None)
          if not entry:
              print(f"::error::IPA '{ipa_id}' is not listed in public/ipas.json")
              sys.exit(1)

          source = entry["source"]
          if source.startswith("http://") or source.startswith("https://"):
              print(f"downloading {source}")
              urllib.request.urlretrieve(source, "unsigned.ipa")
              ipa_path = "unsigned.ipa"
          else:
              ipa_path = os.path.join("public", source)
              if not os.path.isfile(ipa_path):
                  print(f"::error::IPA file not found in repo: {ipa_path}")
                  sys.exit(1)

          size = os.path.getsize(ipa_path)
          print(f"ipa='{ipa_id}' name='{entry['name']}' path='{ipa_path}' size={size}")

          safe = "${{ steps.prep.outputs.safe }}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ipa_id={ipa_id}\n")
              f.write(f"ipa_name={entry['name']}\n")
              f.write(f"ipa_path={ipa_path}\n")
              f.write(f"tag={ipa_id}-signed-{safe}\n")
              f.write(f"asset={ipa_id}-{safe}.ipa\n")
              f.write(f"plist=public/output/{ipa_id}-{safe}.plist\n")
          PYEOF

      - name: Apply PPQ Protection (Feather-style)
        id: ppq
        env:
          IPA_ID: ${{ steps.ipa.outputs.ipa_id }}
          CERT: ${{ steps.prep.outputs.cert }}
          IPA_SRC: ${{ steps.ipa.outputs.ipa_path }}
          PROV: ${{ steps.prep.outputs.mobileprovision }}
        run: |
          python3 - <<'PYEOF'
          # PPQ Protection, ported from Feather (khcrysalis/Feather):
          #  - Feather/Backend/Observable/OptionsManager.swift: `ppqProtection`
          #    appends `ppqString` (6 random chars) to the bundle identifier.
          #  - Feather/Views/Signing/SigningView.swift: it only kicks in when
          #    the certificate's provision has `PPQCheck == true`.
          #  - Feather/Utilities/Handlers/SigningHandler.swift: the new id is
          #    written to the main Info.plist, and plugin Info.plists get an
          #    old-id -> new-id replacement in CFBundleIdentifier,
          #    WKCompanionAppBundleIdentifier,
          #    NSExtension.NSExtensionAttributes.WKAppBundleIdentifier and
          #    NSExtension.NSExtensionFileProviderDocumentGroup.
          # Adaptations for this pipeline:
          #  - Suffix is deterministic per (app, cert) pair (sha256 hex[:6])
          #    instead of random-per-device: Feather persists ppqString per
          #    device, and here one signed build serves every user, so a
          #    stable suffix keeps updates/reinstalls on the same bundle id.
          #  - Our provisions have no PPQCheck key (older enterprise style):
          #    apply unless the key is explicitly false.
          import hashlib, os, plistlib, shutil, sys, zipfile

          ipa_id = os.environ["IPA_ID"]
          cert = os.environ["CERT"]
          src = os.environ["IPA_SRC"]
          prov_path = os.environ["PROV"]
          work = "ppq_unsigned.ipa"
          shutil.copyfile(src, work)

          def out(**kv):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  for k, v in kv.items():
                      f.write(f"{k}={v}\n")

          # 1. Read PPQCheck from the provision, like Feather's CertificateModel.
          raw = open(prov_path, "rb").read()
          s, e = raw.find(b"<?xml"), raw.find(b"</plist>")
          if s < 0 or e < 0:
              print("::warning::Could not parse mobileprovision — skipping PPQ Protection")
              out(ipa_path=src, applied="false", suffix="", ppqcheck="unknown")
              sys.exit(0)
          xml = plistlib.loads(raw[s:e + len(b"</plist>")])
          ppq_check = xml.get("PPQCheck", None)
          print(f"PPQCheck in provision: {ppq_check!r}")
          if ppq_check is False:
              print("PPQCheck=false — skipping PPQ Protection")
              out(ipa_path=src, applied="false", suffix="", ppqcheck="false")
              sys.exit(0)

          # 2. Compute the new bundle id.
          suffix = hashlib.sha256(f"{ipa_id}:{cert}".encode()).hexdigest()[:6]

          def find_plists(names):
              main, plugins = None, []
              for n in names:
                  p = n.split("/")
                  if len(p) == 3 and p[0] == "Payload" and p[1].endswith(".app") and p[2] == "Info.plist":
                      main = n
                  elif (len(p) == 5 and p[0] == "Payload" and p[1].endswith(".app")
                        and p[2] == "PlugIns" and p[3].endswith(".appex") and p[4] == "Info.plist"):
                      plugins.append(n)
              return main, plugins

          with zipfile.ZipFile(work, "r") as zin:
              names = zin.namelist()
          main_plist, plugin_plists = find_plists(names)
          if not main_plist:
              print("::warning::Main Info.plist not found — skipping PPQ Protection")
              out(ipa_path=src, applied="false", suffix="", ppqcheck=str(ppq_check))
              sys.exit(0)

          with zipfile.ZipFile(work, "r") as zin:
              main_info = plistlib.loads(zin.read(main_plist))
          old_main = main_info.get("CFBundleIdentifier", "")
          if not old_main:
              print("::warning::No CFBundleIdentifier in main Info.plist — skipping PPQ Protection")
              out(ipa_path=src, applied="false", suffix="", ppqcheck=str(ppq_check))
              sys.exit(0)
          new_main = old_main if old_main.endswith("." + suffix) else f"{old_main}.{suffix}"

          # 3. Rewrite the IPA: main Info.plist gets the new id; plugins get
          #    an old-id -> new-id replacement (Feather-style).
          def patch_plugin(info):
              changed = []
              def rep(key):
                  v = info.get(key)
                  if isinstance(v, str) and old_main in v:
                      nv = v.replace(old_main, new_main)
                      if nv != v:
                          info[key] = nv
                          changed.append((key, v, nv))
              rep("CFBundleIdentifier")
              rep("WKCompanionAppBundleIdentifier")
              ext = info.get("NSExtension")
              if isinstance(ext, dict):
                  attrs = ext.get("NSExtensionAttributes")
                  if isinstance(attrs, dict):
                      v = attrs.get("WKAppBundleIdentifier")
                      if isinstance(v, str) and old_main in v:
                          nv = v.replace(old_main, new_main)
                          if nv != v:
                              attrs["WKAppBundleIdentifier"] = nv
                              changed.append(("NSExtension.WKAppBundleIdentifier", v, nv))
                  v = ext.get("NSExtensionFileProviderDocumentGroup")
                  if isinstance(v, str) and old_main in v:
                      nv = v.replace(old_main, new_main)
                      if nv != v:
                          ext["NSExtensionFileProviderDocumentGroup"] = nv
                          changed.append(("NSExtension.NSExtensionFileProviderDocumentGroup", v, nv))
              return changed

          patched_plugins = []
          tmp = "ppq_new.ipa"
          with zipfile.ZipFile(work, "r") as zin:
              with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      data = zin.read(item.filename)
                      if item.filename == main_plist:
                          info = plistlib.loads(data)
                          info["CFBundleIdentifier"] = new_main
                          data = plistlib.dumps(info)
                      elif item.filename in plugin_plists:
                          info = plistlib.loads(data)
                          changed = patch_plugin(info)
                          if changed:
                              data = plistlib.dumps(info)
                              patched_plugins.append((item.filename, changed))
                      zout.writestr(item, data)
          shutil.move(tmp, work)

          print(f"PPQ [main]: {old_main} -> {new_main}")
          for pname, changed in patched_plugins:
              for key, v, nv in changed:
                  print(f"PPQ [plugin {pname}] {key}: {v} -> {nv}")
          out(ipa_path=work, applied="true", suffix=suffix, ppqcheck=str(ppq_check))
          PYEOF

      - name: Embed signing-assets provenance folder
        id: assets
        env:
          IPA_IN: ${{ steps.ppq.outputs.ipa_path }}
          IPA_ID: ${{ steps.ipa.outputs.ipa_id }}
          IPA_NAME: ${{ steps.ipa.outputs.ipa_name }}
          CERT: ${{ steps.prep.outputs.cert }}
          PPQ_APPLIED: ${{ steps.ppq.outputs.applied }}
          PPQ_SUFFIX: ${{ steps.ppq.outputs.suffix }}
        run: |
          python3 - <<'PYEOF'
          # Embed a provenance folder inside the .app BEFORE signing, so
          # zsign's code signature covers it:
          #   Payload/<App>.app/signing-assets/SideInstaller/signed.json
          # Records which certificate signed this build, the final bundle
          # id (post-PPQ), and when / by which workflow run it was signed.
          # Auxiliary metadata: any failure here warns and passes the IPA
          # through unsigned-assets rather than failing the whole sign.
          import datetime, json, os, plistlib, shutil, sys, zipfile

          src = os.environ["IPA_IN"]
          work = "assets_unsigned.ipa"

          def out(**kv):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  for k, v in kv.items():
                      f.write(f"{k}={v}\n")

          try:
              with zipfile.ZipFile(src, "r") as zin:
                  names = zin.namelist()
                  info_name = next(
                      (n for n in names
                       if n.startswith("Payload/") and n.count("/") == 2
                       and n.endswith(".app/Info.plist")),
                      None,
                  )
                  if not info_name:
                      print("::warning::Main Info.plist not found — skipping signing-assets embed")
                      out(ipa_path=src, embedded="false")
                      sys.exit(0)
                  info = plistlib.loads(zin.read(info_name))

              app_dir = info_name.rsplit("/", 1)[0]  # Payload/<App>.app
              meta = {
                  "signer": "SideInstaller",
                  "site": "https://sideinstaller.pages.dev",
                  "app": {
                      "id": os.environ.get("IPA_ID", ""),
                      "name": os.environ.get("IPA_NAME", ""),
                      "bundleId": info.get("CFBundleIdentifier", ""),
                      "version": str(info.get("CFBundleShortVersionString")
                                     or info.get("CFBundleVersion") or ""),
                  },
                  "certificate": os.environ.get("CERT", ""),
                  "ppq": {
                      "applied": os.environ.get("PPQ_APPLIED") == "true",
                      "suffix": os.environ.get("PPQ_SUFFIX", ""),
                  },
                  "signedAt": datetime.datetime.now(datetime.timezone.utc)
                              .strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "workflow": {
                      "repo": os.environ.get("GITHUB_REPOSITORY", ""),
                      "runId": os.environ.get("GITHUB_RUN_ID", ""),
                      "runNumber": os.environ.get("GITHUB_RUN_NUMBER", ""),
                  },
              }
              payload = (json.dumps(meta, indent=2, ensure_ascii=False) + "\n").encode("utf-8")
              target = f"{app_dir}/signing-assets/SideInstaller/signed.json"

              with zipfile.ZipFile(src, "r") as zin:
                  with zipfile.ZipFile(work, "w", zipfile.ZIP_DEFLATED) as zout:
                      for item in zin.infolist():
                          if item.filename == target:
                              continue  # replace any stale copy from a previous embed
                          zout.writestr(item, zin.read(item.filename))
                      zout.writestr(target, payload)
              print(f"embedded {target}")
              print(payload.decode("utf-8"))
              out(ipa_path=work, embedded="true")
          except SystemExit:
              raise
          except Exception as exc:
              print(f"::warning::signing-assets embed failed ({exc}) — continuing without it")
              out(ipa_path=src, embedded="false")
          PYEOF

      - name: Build zsign from source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git g++ pkg-config libssl-dev
          git clone --depth 1 https://github.com/zhlynn/zsign.git zsign-src
          make -C zsign-src/build/linux clean
          make -C zsign-src/build/linux -j"$(nproc)"
          # NOTE: Makefile của zsign output binary ra zsign-src/bin/zsign,
          # KHÔNG phải zsign-src/build/linux/zsign
          ./zsign-src/bin/zsign -v
          echo "ZSIGN_BIN=$PWD/zsign-src/bin/zsign" >> "$GITHUB_ENV"

      - name: Sign IPA with zsign
        run: |
          set -euo pipefail
          args=(-k "${{ steps.prep.outputs.p12 }}" -m "${{ steps.prep.outputs.mobileprovision }}" -o signed.ipa)
          if [ -n "${P12_PASS:-}" ]; then
            args+=(-p "$P12_PASS")
          fi
          args+=("${{ steps.assets.outputs.ipa_path }}")
          "$ZSIGN_BIN" "${args[@]}"
          ls -lh signed.ipa

      - name: Read bundle info from signed IPA
        id: bundle
        run: |
          python3 - <<'PYEOF'
          import os, plistlib, zipfile
          with zipfile.ZipFile("signed.ipa") as z:
              info_name = next(
                  n for n in z.namelist()
                  if n.startswith("Payload/") and n.count("/") == 2 and n.endswith(".app/Info.plist")
              )
              info = plistlib.loads(z.read(info_name))
          bid = info["CFBundleIdentifier"]
          ver = str(info.get("CFBundleShortVersionString") or info.get("CFBundleVersion") or "1.0")
          title = str(info.get("CFBundleDisplayName") or info.get("CFBundleName") or "App")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"bundle_id={bid}\n")
              f.write(f"bundle_version={ver}\n")
              f.write(f"title={title}\n")
          print(f"bundle_id={bid} version={ver} title={title}")
          PYEOF

      - name: Publish signed IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ipa.outputs.tag }}"
          ASSET="${{ steps.ipa.outputs.asset }}"
          cp signed.ipa "$ASSET"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "${{ steps.ipa.outputs.ipa_name }} (signed) — ${{ steps.prep.outputs.cert }}" \
              --notes "${{ steps.ipa.outputs.ipa_name }} automatically signed with the **${{ steps.prep.outputs.cert }}** certificate by the \"Sign IPA\" workflow. The website installs it via the matching OTA manifest in public/output/. Do not delete this release while the certificate is in use."
          fi
          # Upload phải idempotent: re-run (hoặc 2 run đua nhau sau double-tap)
          # upload cùng tên asset. Xóa asset cũ theo tên trước — chỉ dùng
          # --clobber có thể 422 "ReleaseAsset.name already exists" khi race.
          gh release delete-asset "$TAG" "$ASSET" -y 2>/dev/null || true
          gh release upload "$TAG" "$ASSET"
          echo "Released: $(gh release view "$TAG" --json url -q .url)"

      - name: Generate OTA install manifest (plist)
        env:
          REPO_FULL: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import os
          repo = os.environ["REPO_FULL"]
          tag = "${{ steps.ipa.outputs.tag }}"
          asset = "${{ steps.ipa.outputs.asset }}"
          plist_path = "${{ steps.ipa.outputs.plist }}"
          bundle_id = "${{ steps.bundle.outputs.bundle_id }}"
          bundle_version = "${{ steps.bundle.outputs.bundle_version }}"
          title = "${{ steps.bundle.outputs.title }}"
          ipa_url = f"https://github.com/{repo}/releases/download/{tag}/{asset}"

          def esc(s):
              return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          lines = [
          '<?xml version="1.0" encoding="UTF-8"?>',
          '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
          '<plist version="1.0">',
          '<dict>',
          '  <key>items</key>',
          '  <array>',
          '    <dict>',
          '      <key>assets</key>',
          '      <array>',
          '        <dict>',
          '          <key>kind</key>',
          '          <string>software-package</string>',
          '          <key>url</key>',
          '          <string>' + esc(ipa_url) + '</string>',
          '        </dict>',
          '      </array>',
          '      <key>metadata</key>',
          '      <dict>',
          '        <key>bundle-identifier</key>',
          '        <string>' + esc(bundle_id) + '</string>',
          '        <key>bundle-version</key>',
          '        <string>' + esc(bundle_version) + '</string>',
          '        <key>kind</key>',
          '        <string>software</string>',
          '        <key>title</key>',
          '        <string>' + esc(title) + '</string>',
          '      </dict>',
          '    </dict>',
          '  </array>',
          '</dict>',
          '</plist>',
          ]
          os.makedirs(os.path.dirname(plist_path), exist_ok=True)
          with open(plist_path, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print(f"wrote {plist_path} -> {ipa_url}")
          PYEOF

      - name: Commit OTA manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.ipa.outputs.plist }}"
          if git diff --cached --quiet; then
            echo "manifest unchanged, nothing to commit"
          else
            git commit -m "chore: signed ${{ steps.ipa.outputs.ipa_id }} manifest for ${{ steps.prep.outputs.cert }}"
            git push
          fi

      - name: Summary
        run: |
          {
            echo "### ${{ steps.ipa.outputs.ipa_name }} signed"
            echo ""
            echo "- Certificate: \`${{ steps.prep.outputs.cert }}\`"
            echo "- Release tag: \`${{ steps.ipa.outputs.tag }}\`"
            echo "- Manifest: \`${{ steps.ipa.outputs.plist }}\`"
            echo "- Bundle ID: \`${{ steps.bundle.outputs.bundle_id }}\`"
            if [ "${{ steps.ppq.outputs.applied }}" = "true" ]; then
              echo "- PPQ Protection: applied (\`.${{ steps.ppq.outputs.suffix }}\`, PPQCheck=${{ steps.ppq.outputs.ppqcheck }})"
            else
              echo "- PPQ Protection: skipped (PPQCheck=${{ steps.ppq.outputs.ppqcheck }})"
            fi
            echo "- Signing assets: \`signing-assets/SideInstaller/signed.json\` embedded: ${{ steps.assets.outputs.embedded }}"
          } >> "$GITHUB_STEP_SUMMARY"
